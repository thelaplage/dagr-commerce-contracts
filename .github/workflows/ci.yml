name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (hermetic pin set)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r constraints-ci.txt
          python -m pip install -e .

      - name: Reference validator (per-check, path-scoped)
        run: PYTHONPATH=src python -m dagr_commerce_contracts.validate

      - name: Version policy is not stale
        run: |
          python scripts/gen_version_policy.py
          git diff --exit-code compatibility/version-policy.v0.1.json

      - name: Test suite
        run: python -m pytest -q

      - name: Whitespace / conflict-marker check
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
